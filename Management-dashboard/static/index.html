<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salem Cybersecurity - Teams & Solutions</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <h1>Vulnerability Remediation by Team</h1>
  <p class="sub">Live Data from MySQL Database</p>

  <div class="filters" id="filters">
    <button onclick="drawTable(this, 'All')">All</button>
    <button onclick="drawTable(this, 'Critical')">Critical</button>
    <button onclick="drawTable(this, 'High')">High</button>
    <button onclick="drawTable(this, 'Medium')">Medium</button>
    <button onclick="drawTable(this, 'Low')">Low</button>
  </div>

  <div class="wrap">
    <table>
      <thead>
        <tr>
          <th>Team</th>
          <th>Client</th>
          <th>Vulnerability</th>
          <th>Severity</th>
          <th>How it was fixed (Method)</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script src="/static/script.js"></script>
</body>
</html>
